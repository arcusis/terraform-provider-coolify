name: Acceptance Tests

on:
  pull_request:
    branches: [Production]
  push:
    branches: [Production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    name: Provider acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build provider binary
        run: go build -o terraform-provider-coolify .

      - name: Configure Terraform dev override
        run: |
          cat > ~/.terraformrc <<EOF
          provider_installation {
            dev_overrides { "arcusis/coolify" = "$PWD" }
            direct {}
          }
          EOF

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # ── Coolify requires /data/coolify — create with sudo ─────────────────────
      - name: Create Coolify data directories
        run: |
          sudo mkdir -p /data/coolify/source /data/coolify/ssh/keys /data/coolify/ssh/mux \
            /data/coolify/applications /data/coolify/databases /data/coolify/services \
            /data/coolify/backups /data/coolify/proxy/dynamic
          sudo chown -R "$USER:$USER" /data

      - name: Download Coolify compose files
        run: |
          curl -fsSL https://cdn.coollabs.io/coolify/docker-compose.yml \
            -o /data/coolify/source/docker-compose.yml
          curl -fsSL https://cdn.coollabs.io/coolify/docker-compose.prod.yml \
            -o /data/coolify/source/docker-compose.prod.yml

      - name: Write Coolify .env
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          PUSHER_ID="$(openssl rand -hex 16)"
          PUSHER_KEY="$(openssl rand -hex 16)"
          PUSHER_SECRET="$(openssl rand -hex 16)"
          REDIS_PASS="$(openssl rand -hex 16)"

          # Write without any leading whitespace — heredoc content must be unindented
          cat > /data/coolify/source/.env <<EOF
          APP_ID=ci-$(openssl rand -hex 8)
          APP_KEY=$APP_KEY
          APP_NAME=Coolify
          APP_URL=http://localhost:8000
          APP_PORT=8000
          APP_ENV=production
          APP_DEBUG=false
          DB_CONNECTION=pgsql
          DB_HOST=coolify-db
          DB_PORT=5432
          DB_DATABASE=coolify
          DB_USERNAME=coolify
          DB_PASSWORD=ci_db_password
          REDIS_HOST=coolify-redis
          REDIS_PASSWORD=$REDIS_PASS
          REDIS_PORT=6379
          PUSHER_APP_ID=$PUSHER_ID
          PUSHER_APP_KEY=$PUSHER_KEY
          PUSHER_APP_SECRET=$PUSHER_SECRET
          PUSHER_HOST=localhost
          PUSHER_PORT=6001
          PUSHER_SCHEME=http
          QUEUE_CONNECTION=sync
          CACHE_DRIVER=redis
          SESSION_DRIVER=redis
          SESSION_LIFETIME=120
          ROOT_USER_EMAIL=ci@test.example.com
          ROOT_USER_PASSWORD=CItest1!Password
          EOF

          # Write a clean version (remove leading spaces from heredoc)
          sed -i 's/^[[:space:]]*//' /data/coolify/source/.env
          echo "=== .env written ==="
          head -5 /data/coolify/source/.env

      - name: Start Coolify
        run: |
          docker network create coolify 2>/dev/null || true
          cd /data/coolify/source
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
          echo "Waiting for Coolify (up to 3 min)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000 -o /dev/null 2>&1; then
              echo " up after ${i}x5s"
              break
            fi
            sleep 5
            echo -n "."
          done
          sleep 15

      - name: Verify Coolify is up
        run: |
          curl -sf http://localhost:8000 -o /dev/null -w "HTTP: %{http_code}\n"

      - name: Create admin user and API token
        id: token
        run: |
          CONTAINER=$(docker ps --filter "name=^/coolify$" --format "{{.ID}}" | head -1)
          echo "Coolify container: $CONTAINER"

          # Ensure a root user exists — ROOT_USER vars are only read by install.sh,
          # not by the container startup. Create the user directly via artisan.
          docker exec "$CONTAINER" php artisan tinker \
            --execute='
              if (!App\Models\User::count()) {
                $user = App\Models\User::create([
                  "name" => "admin",
                  "email" => "ci@test.example.com",
                  "password" => Hash::make("CItest1!Password"),
                  "email_verified_at" => now(),
                ]);
                $team = new App\Models\Team(["name" => "Root Team", "personal_team" => true]);
                $team->save();
                $user->teams()->attach($team->id);
                echo "Created user id=" . $user->id;
              } else {
                echo "User exists id=" . App\Models\User::first()->id;
              }
            ' 2>/dev/null | grep -v "^\s*$" | tail -1

          # Try standard createToken first
          TOKEN=$(docker exec "$CONTAINER" php artisan tinker \
            --execute='$u=App\Models\User::first(); if($u) echo $u->createToken("ci")->plainTextToken;' \
            2>/dev/null | grep -E '^[0-9]+\|' | tail -1 || true)

          # Fallback: direct DB insert if createToken fails (team_id constraint)
          if [ -z "$TOKEN" ]; then
            echo "Falling back to direct SQL token insert..."
            PLAIN=$(openssl rand -hex 20)
            HASH=$(printf '%s' "$PLAIN" | sha256sum | cut -d' ' -f1)
            TEAM_ID=$(docker exec "$CONTAINER" php artisan tinker \
              --execute='echo App\Models\Team::first()?->id ?? 0;' \
              2>/dev/null | grep -E '^[0-9]+$' | tail -1 || echo "0")
            USER_ID=$(docker exec "$CONTAINER" php artisan tinker \
              --execute='echo App\Models\User::first()?->id ?? 0;' \
              2>/dev/null | grep -E '^[0-9]+$' | tail -1 || echo "0")
            TOKEN_ID=$(docker exec "$CONTAINER" php artisan tinker \
              --execute="echo DB::table('personal_access_tokens')->insertGetId([
                'tokenable_type'=>'App\\\Models\\\User',
                'tokenable_id'=>$USER_ID,
                'name'=>'ci',
                'token'=>'$HASH',
                'team_id'=>'$TEAM_ID',
                'abilities'=>'[\"*\"]',
                'created_at'=>now(),
                'updated_at'=>now(),
              ]);" \
              2>/dev/null | grep -E '^[0-9]+$' | tail -1 || echo "")
            TOKEN="${TOKEN_ID}|${PLAIN}"
          fi

          echo "Token present: $([ -n "$TOKEN" ] && echo YES || echo NO)"
          [ -n "$TOKEN" ] || { echo "ERROR: no token"; exit 1; }

          curl -sf http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" -w " HTTP:%{http_code}" && echo

          # Mask the token in logs
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # ── Smoke test token before Terraform ────────────────────────────────────
      - name: Verify token works for GET and POST
        run: |
          TOKEN="${{ steps.token.outputs.token }}"
          echo "=== GET /api/v1/projects ==="
          curl -sf http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" -w " HTTP:%{http_code}\n"
          echo "=== POST /api/v1/projects ==="
          RESULT=$(curl -sf -X POST http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke-test","description":"smoke"}' \
            -w "\nHTTP:%{http_code}" 2>&1)
          echo "$RESULT"
          # Clean up smoke test project
          UUID=$(echo "$RESULT" | python3 -c "import json,sys; print(json.loads(sys.stdin.readline()).get('uuid',''))" 2>/dev/null || true)
          [ -n "$UUID" ] && curl -sf -X DELETE "http://localhost:8000/api/v1/projects/$UUID" \
            -H "Authorization: Bearer $TOKEN" || true

      # ── Terraform tests ───────────────────────────────────────────────────────
      - name: Terraform Plan
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: terraform plan -no-color

      - name: Terraform Apply
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: terraform apply -auto-approve -no-color

      - name: Verify project exists in Coolify API
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: |
          UUID=$(terraform output -raw project_uuid)
          echo "Project UUID from Terraform state: $UUID"
          [ -n "$UUID" ] || { echo "FAIL: empty project_uuid"; exit 1; }

          NAME=$(curl -sf "http://localhost:8000/api/v1/projects/$UUID" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))")
          echo "Project name in Coolify: $NAME"
          [ "$NAME" = "acceptance-test-project" ] || \
            { echo "FAIL: expected 'acceptance-test-project' got '$NAME'"; exit 1; }

      - name: Terraform Import
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: |
          UUID=$(terraform output -raw project_uuid)
          terraform state rm coolify_project.test
          terraform import coolify_project.test "$UUID"

      - name: Terraform Plan after import — expect no changes
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: |
          # exit 0 = no changes (correct), exit 2 = changes (import drift)
          terraform plan -detailed-exitcode -no-color
          echo "No-op plan confirmed"

      - name: Terraform Destroy
        if: always()
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: terraform destroy -auto-approve -no-color || true

      - name: Verify cleanup — 0 projects remaining
        if: always()
        run: |
          TOKEN="${{ steps.token.outputs.token }}"
          COUNT=$(curl -sf http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
          echo "Projects after destroy: $COUNT"
          [ "$COUNT" = "0" ] || [ "$COUNT" = "?" ] || \
            { echo "FAIL: $COUNT projects not cleaned up"; exit 1; }

      - name: Stop Coolify
        if: always()
        run: |
          cd /data/coolify/source 2>/dev/null && \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v 2>/dev/null || true
