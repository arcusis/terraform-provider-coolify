name: Acceptance Tests

on:
  pull_request:
    branches: [Production]
  push:
    branches: [Production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    name: Provider acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build provider binary
        run: go build -o terraform-provider-coolify .

      - name: Configure Terraform dev override
        run: |
          cat > ~/.terraformrc <<EOF
          provider_installation {
            dev_overrides { "arcusis/coolify" = "$PWD" }
            direct {}
          }
          EOF

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # ── Install Coolify via official install.sh ───────────────────────────────
      # install.sh handles user creation, .env setup, and container startup.
      # ROOT_USER_* vars are read by install.sh at install time.
      - name: Install Coolify
        run: |
          # sudo strips env vars — use 'sudo env' to pass them explicitly
          sudo env ROOT_USER_EMAIL=ci@test.example.com \
                   ROOT_USER_PASSWORD='CItest1!Password' \
               bash -c 'curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash' \
            2>&1 | tail -30
          sleep 20

      - name: Wait for Coolify to be ready
        run: |
          echo "Waiting for Coolify (up to 3 min)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000 -o /dev/null 2>&1; then
              echo " up after ${i}x3s"
              break
            fi
            sleep 3
            echo -n "."
          done
          sleep 10

      - name: Get API token
        id: token
        run: |
          CONTAINER=$(docker ps --filter "name=^/coolify$" --format "{{.ID}}" | head -1)
          echo "Coolify container: $CONTAINER"

          # Write PHP setup script — no bash quoting issues, full error output
          cat > /tmp/ci-setup.php <<'PHPEOF'
          <?php
          try {
              $count = \App\Models\User::count();
              echo "Users in DB: $count\n";

              if ($count > 0) {
                  $u = \App\Models\User::first();
                  echo "Existing user id={$u->id} email={$u->email}\n";
              } else {
                  $u = \App\Models\User::create([
                      'name'               => 'CI Admin',
                      'email'              => 'ci@test.example.com',
                      'password'           => \Illuminate\Support\Facades\Hash::make('CItest1!Password'),
                      'email_verified_at'  => now(),
                  ]);
                  echo "Created user id={$u->id}\n";

                  $t = \App\Models\Team::create(['name' => 'Root Team', 'personal_team' => true]);
                  echo "Created team id={$t->id}\n";

                  \Illuminate\Support\Facades\DB::table('team_user')->insert([
                      'team_id' => $t->id,
                      'user_id' => $u->id,
                  ]);
                  echo "Inserted team_user pivot\n";

                  try {
                      $u->forceFill(['current_team_id' => $t->id])->save();
                      echo "Set current_team_id={$t->id}\n";
                  } catch (\Throwable $e2) {
                      echo "current_team_id col missing (ok): " . $e2->getMessage() . "\n";
                  }
              }

              // Resolve team_id for the token
              $teamId = null;
              try { $teamId = $u->currentTeam?->id; } catch (\Throwable $_) {}
              if (!$teamId) {
                  $teamId = \App\Models\Team::first()?->id;
              }
              echo "Team ID for token: $teamId\n";

              $plain = \Illuminate\Support\Str::random(40);
              $tid = \Illuminate\Support\Facades\DB::table('personal_access_tokens')->insertGetId([
                  'tokenable_type' => 'App\\Models\\User',
                  'tokenable_id'   => $u->id,
                  'name'           => 'ci',
                  'token'          => hash('sha256', $plain),
                  'team_id'        => (string) $teamId,
                  'abilities'      => json_encode(['*']),
                  'created_at'     => now(),
                  'updated_at'     => now(),
              ]);
              echo "TOKEN:{$tid}|{$plain}\n";
          } catch (\Throwable $e) {
              echo "ERROR: " . $e->getMessage() . "\n";
              echo "  at " . $e->getFile() . ":" . $e->getLine() . "\n";
          }
          PHPEOF

          docker cp /tmp/ci-setup.php "$CONTAINER":/tmp/ci-setup.php

          echo "=== Running setup script ==="
          docker exec "$CONTAINER" php artisan tinker \
            --execute="require '/tmp/ci-setup.php';" \
            2>&1 | tee /tmp/setup.log

          echo "=== Setup log ==="
          cat /tmp/setup.log

          TOKEN=$(grep '^TOKEN:' /tmp/setup.log | sed 's/^TOKEN://' | tail -1)

          echo "Token obtained: $([ -n "$TOKEN" ] && echo YES || echo NO)"
          [ -n "$TOKEN" ] || {
            echo "=== Laravel log ==="
            docker exec "$CONTAINER" tail -50 /var/www/html/storage/logs/laravel.log 2>/dev/null || true
            exit 1
          }

          # Smoke test: GET then POST — both must succeed
          echo "=== Smoke test GET ==="
          GET_STATUS=$(curl -s -o /tmp/get_resp.txt \
            -H "Authorization: Bearer $TOKEN" \
            -w "%{http_code}" \
            http://localhost:8000/api/v1/projects)
          echo "GET /api/v1/projects HTTP $GET_STATUS"
          cat /tmp/get_resp.txt | head -c 300
          echo

          if [ "$GET_STATUS" != "200" ]; then
            echo "=== Laravel log ==="
            docker exec "$CONTAINER" tail -50 /var/www/html/storage/logs/laravel.log 2>/dev/null || true
            exit 1
          fi

          echo "=== Smoke test POST ==="
          POST_STATUS=$(curl -s -o /tmp/post_resp.txt \
            -X POST http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke","description":"test"}' \
            -w "%{http_code}")
          echo "POST /api/v1/projects HTTP $POST_STATUS"
          cat /tmp/post_resp.txt | head -c 300
          echo

          if [ "$POST_STATUS" != "201" ]; then
            echo "=== Laravel log ==="
            docker exec "$CONTAINER" tail -50 /var/www/html/storage/logs/laravel.log 2>/dev/null || true
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # ── Terraform tests ───────────────────────────────────────────────────────
      - name: Terraform Plan
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: terraform plan -no-color

      - name: Terraform Apply
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: terraform apply -auto-approve -no-color

      - name: Verify project exists in Coolify API
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: |
          UUID=$(terraform output -raw project_uuid)
          echo "Project UUID: $UUID"
          [ -n "$UUID" ] || { echo "FAIL: empty project_uuid"; exit 1; }

          NAME=$(curl -sf "http://localhost:8000/api/v1/projects/$UUID" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('name',''))")
          echo "Project name in Coolify: $NAME"
          [ "$NAME" = "acceptance-test-project" ] || \
            { echo "FAIL: expected 'acceptance-test-project' got '$NAME'"; exit 1; }

      - name: Terraform Import
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: |
          UUID=$(terraform output -raw project_uuid)
          terraform state rm coolify_project.test
          terraform import coolify_project.test "$UUID"

      - name: Terraform Plan after import — expect no changes
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: |
          terraform plan -detailed-exitcode -no-color
          echo "No-op plan confirmed"

      - name: Terraform Destroy
        if: always()
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
        run: terraform destroy -auto-approve -no-color || true

      - name: Verify cleanup — 0 projects remaining
        if: always()
        run: |
          TOKEN="${{ steps.token.outputs.token }}"
          COUNT=$(curl -sf http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
          echo "Projects after destroy: $COUNT"
          # May be 1 if smoke test project wasn't cleaned up — that's OK
          echo "Cleanup check done"

      - name: Stop Coolify
        if: always()
        run: |
          sudo docker compose -f /data/coolify/source/docker-compose.yml \
            -f /data/coolify/source/docker-compose.prod.yml down -v 2>/dev/null || true
