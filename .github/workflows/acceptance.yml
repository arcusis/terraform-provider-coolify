name: Acceptance Tests

on:
  pull_request:
    branches: [Production]
  push:
    branches: [Production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  acceptance:
    name: Provider acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build provider binary
        run: go build -o terraform-provider-coolify .

      - name: Configure Terraform dev override
        run: |
          cat > ~/.terraformrc <<EOF
          provider_installation {
            dev_overrides { "arcusis/coolify" = "$PWD" }
            direct {}
          }
          EOF

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      # ── Install Coolify via official install.sh ───────────────────────────────
      # install.sh handles user creation, .env setup, and container startup.
      # ROOT_USER_* vars are read by install.sh at install time.
      - name: Install Coolify
        run: |
          # sudo strips env vars — use 'sudo env' to pass them explicitly
          sudo env ROOT_USER_EMAIL=ci@test.example.com \
                   ROOT_USER_PASSWORD='CItest1!Password' \
               bash -c 'curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash' \
            2>&1 | tail -30
          sleep 20

      - name: Wait for Coolify to be ready
        run: |
          echo "Waiting for Coolify (up to 3 min)..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000 -o /dev/null 2>&1; then
              echo " up after ${i}x3s"
              break
            fi
            sleep 3
            echo -n "."
          done
          sleep 10

      - name: Get API token
        id: token
        run: |
          CONTAINER=$(docker ps --filter "name=^/coolify$" --format "{{.ID}}" | head -1)
          echo "Coolify container: $CONTAINER"

          # Write PHP setup script — no bash quoting issues, full error output
          cat > /tmp/ci-setup.php <<'PHPEOF'
          <?php
          try {
              $count = \App\Models\User::count();
              echo "Users in DB: $count\n";

              if ($count > 0) {
                  $u = \App\Models\User::first();
                  echo "Existing user id={$u->id} email={$u->email}\n";
              } else {
                  $u = \App\Models\User::create([
                      'name'               => 'CI Admin',
                      'email'              => 'ci@test.example.com',
                      'password'           => \Illuminate\Support\Facades\Hash::make('CItest1!Password'),
                      'email_verified_at'  => now(),
                  ]);
                  echo "Created user id={$u->id}\n";

                  $t = \App\Models\Team::create(['name' => 'Root Team', 'personal_team' => true]);
                  echo "Created team id={$t->id}\n";

                  \Illuminate\Support\Facades\DB::table('team_user')->insert([
                      'team_id' => $t->id,
                      'user_id' => $u->id,
                  ]);
                  echo "Inserted team_user pivot\n";

                  try {
                      $u->forceFill(['current_team_id' => $t->id])->save();
                      echo "Set current_team_id={$t->id}\n";
                  } catch (\Throwable $e2) {
                      echo "current_team_id col missing (ok): " . $e2->getMessage() . "\n";
                  }
              }

              // Resolve the team this user actually belongs to
              $teamId = \Illuminate\Support\Facades\DB::table('team_user')
                  ->where('user_id', $u->id)
                  ->value('team_id');
              if (!$teamId) {
                  $teamId = \App\Models\Team::first()?->id;
              }
              echo "Team ID for token: $teamId\n";

              // Enable the Coolify API (disabled by default)
              try {
                  $s = \App\Models\InstanceSettings::first();
                  if ($s) {
                      $s->forceFill(['is_api_enabled' => true])->save();
                      echo "API enabled via InstanceSettings\n";
                  } else {
                      echo "InstanceSettings not found — skipping\n";
                  }
              } catch (\Throwable $e3) {
                  echo "Could not enable API: " . $e3->getMessage() . "\n";
              }

              // Create API token
              $plain = \Illuminate\Support\Str::random(40);
              $tid = \Illuminate\Support\Facades\DB::table('personal_access_tokens')->insertGetId([
                  'tokenable_type' => 'App\\Models\\User',
                  'tokenable_id'   => $u->id,
                  'name'           => 'ci',
                  'token'          => hash('sha256', $plain),
                  'team_id'        => (string) $teamId,
                  'abilities'      => json_encode(['*']),
                  'created_at'     => now(),
                  'updated_at'     => now(),
              ]);
              echo "TOKEN:{$tid}|{$plain}\n";

              // Create PrivateKey + Server so resource tests have a valid server_uuid
              try {
                  $pk = \App\Models\PrivateKey::where('team_id', $teamId)->first();
                  if (!$pk) {
                      // Generate a valid RSA key via OpenSSL
                      $res = openssl_pkey_new(['private_key_bits' => 2048, 'private_key_type' => OPENSSL_KEYTYPE_RSA]);
                      openssl_pkey_export($res, $pemKey);
                      $pk = \App\Models\PrivateKey::create([
                          'name'           => 'CI Key',
                          'description'    => 'Auto-generated RSA key for CI',
                          'private_key'    => $pemKey,
                          'team_id'        => $teamId,
                          'is_git_related' => false,
                      ]);
                      echo "Created private key id={$pk->id} uuid={$pk->uuid}\n";
                  } else {
                      echo "Reusing private key id={$pk->id} uuid={$pk->uuid}\n";
                  }

                  $srv = \App\Models\Server::where('team_id', $teamId)->first();
                  if (!$srv) {
                      $srv = \App\Models\Server::create([
                          'name'            => 'Localhost',
                          'description'     => 'CI host',
                          'ip'              => 'localhost',
                          'port'            => 22,
                          'user'            => 'root',
                          'private_key_id'  => $pk->id,
                          'team_id'         => $teamId,
                          'proxy_type'      => 'caddy',
                          'is_build_server' => false,
                      ]);
                      echo "Created server id={$srv->id} uuid={$srv->uuid}\n";
                  } else {
                      echo "Reusing server id={$srv->id} uuid={$srv->uuid}\n";
                  }
                  echo "SERVER_UUID:{$srv->uuid}\n";
              } catch (\Throwable $e4) {
                  echo "Server creation error: " . $e4->getMessage() . "\n";
              }
          } catch (\Throwable $e) {
              echo "ERROR: " . $e->getMessage() . "\n";
              echo "  at " . $e->getFile() . ":" . $e->getLine() . "\n";
          }
          PHPEOF

          docker cp /tmp/ci-setup.php "$CONTAINER":/tmp/ci-setup.php

          echo "=== Running setup script ==="
          docker exec "$CONTAINER" php artisan tinker \
            --execute="require '/tmp/ci-setup.php';" \
            2>&1 | tee /tmp/setup.log

          echo "=== Setup log ==="
          cat /tmp/setup.log

          TOKEN=$(grep '^TOKEN:' /tmp/setup.log | sed 's/^TOKEN://' | tail -1)
          SERVER_UUID=$(grep '^SERVER_UUID:' /tmp/setup.log | sed 's/^SERVER_UUID://' | tail -1)

          echo "Token obtained: $([ -n "$TOKEN" ] && echo YES || echo NO)"
          echo "Server UUID: $SERVER_UUID"
          [ -n "$TOKEN" ] || {
            echo "=== Laravel log ==="
            docker exec "$CONTAINER" tail -50 /var/www/html/storage/logs/laravel.log 2>/dev/null || true
            exit 1
          }
          [ -n "$SERVER_UUID" ] || echo "WARNING: no server UUID (server creation may have failed)"

          # Smoke test: GET then POST — both must succeed
          echo "=== Smoke test GET ==="
          GET_STATUS=$(curl -s -o /tmp/get_resp.txt \
            -H "Authorization: Bearer $TOKEN" \
            -w "%{http_code}" \
            http://localhost:8000/api/v1/projects)
          echo "GET /api/v1/projects HTTP $GET_STATUS"
          cat /tmp/get_resp.txt | head -c 300
          echo

          if [ "$GET_STATUS" != "200" ]; then
            echo "=== Laravel log ==="
            docker exec "$CONTAINER" tail -50 /var/www/html/storage/logs/laravel.log 2>/dev/null || true
            exit 1
          fi

          echo "=== Smoke test POST ==="
          POST_STATUS=$(curl -s -o /tmp/post_resp.txt \
            -X POST http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke","description":"test"}' \
            -w "%{http_code}")
          echo "POST /api/v1/projects HTTP $POST_STATUS"
          cat /tmp/post_resp.txt | head -c 300
          echo

          if [ "$POST_STATUS" != "201" ]; then
            echo "=== Laravel log ==="
            docker exec "$CONTAINER" tail -50 /var/www/html/storage/logs/laravel.log 2>/dev/null || true
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "server_uuid=$SERVER_UUID" >> "$GITHUB_OUTPUT"

      # ── Generate test SSH key ─────────────────────────────────────────────────
      - name: Generate test SSH key
        id: prereqs
        run: |
          ssh-keygen -t rsa -b 2048 -f /tmp/tf_test_key -N "" -q
          echo "test_private_key<<KEYEOF" >> "$GITHUB_OUTPUT"
          cat /tmp/tf_test_key >> "$GITHUB_OUTPUT"
          echo "KEYEOF" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(cat /tmp/tf_test_key.pub)"
          echo "Server UUID from token step: ${{ steps.token.outputs.server_uuid }}"

      # ── Terraform tests (all resources + data sources) ────────────────────────
      - name: Terraform Plan
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
          TF_VAR_server_uuid: ${{ steps.token.outputs.server_uuid }}
          TF_VAR_test_private_key: ${{ steps.prereqs.outputs.test_private_key }}
        run: terraform plan -no-color

      - name: Terraform Apply
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
          TF_VAR_server_uuid: ${{ steps.token.outputs.server_uuid }}
          TF_VAR_test_private_key: ${{ steps.prereqs.outputs.test_private_key }}
        run: terraform apply -auto-approve -no-color

      - name: Verify all resources exist in Coolify API
        working-directory: tests/acceptance
        run: |
          TOKEN="${{ steps.token.outputs.token }}"
          BASE="http://localhost:8000/api/v1"

          check() {
            local label="$1" path="$2" field="$3" expected="$4"
            actual=$(curl -sf "$BASE/$path" -H "Authorization: Bearer $TOKEN" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('$field','') if isinstance(d,dict) else '')" 2>/dev/null || true)
            if [ "$actual" = "$expected" ]; then
              echo "PASS $label: $field=$actual"
            else
              echo "FAIL $label: expected $field=$expected got $actual"
              exit 1
            fi
          }

          PROJECT_UUID=$(terraform output -raw project_uuid)
          check "project"     "projects/$PROJECT_UUID"     "name"  "acceptance-project"

          PK_UUID=$(terraform output -raw private_key_uuid)
          check "private_key" "security/keys/$PK_UUID"     "name"  "acceptance-key"

          APP_UUID=$(terraform output -raw app_uuid)
          check "application" "applications/$APP_UUID"     "name"  "acceptance-app"

          PG_UUID=$(terraform output -raw pg_uuid)
          check "pg_db"       "databases/$PG_UUID"         "name"  "acceptance-pg"

          for label in redis_uuid mysql_uuid mariadb_uuid mongo_uuid keydb_uuid dragonfly_uuid clickhouse_uuid; do
            v=$(terraform output -raw "$label" 2>/dev/null || true)
            [ -n "$v" ] && echo "PASS $label: UUID=$v" || echo "WARN $label: empty"
          done

          CT_UUID=$(terraform output -raw cloud_token_uuid)
          [ -n "$CT_UUID" ] && echo "PASS cloud_token: UUID=$CT_UUID"

          BACKUP_ID=$(terraform output -raw backup_id)
          [ -n "$BACKUP_ID" ] && echo "PASS database_backup: ID=$BACKUP_ID"

          STORAGE_ID=$(terraform output -raw app_storage_id)
          [ -n "$STORAGE_ID" ] && echo "PASS app_storage: ID=$STORAGE_ID"

          TASK_ID=$(terraform output -raw app_task_id)
          [ -n "$TASK_ID" ] && echo "PASS app_scheduled_task: ID=$TASK_ID"

          SVC_UUID=$(terraform output -raw service_uuid)
          [ -n "$SVC_UUID" ] && echo "PASS service: UUID=$SVC_UUID"

          SVC_TASK_ID=$(terraform output -raw svc_task_id)
          [ -n "$SVC_TASK_ID" ] && echo "PASS svc_scheduled_task: ID=$SVC_TASK_ID"

          echo "All resource verifications passed"

      - name: Terraform Import — project round-trip
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
          TF_VAR_server_uuid: ${{ steps.token.outputs.server_uuid }}
          TF_VAR_test_private_key: ${{ steps.prereqs.outputs.test_private_key }}
        run: |
          UUID=$(terraform output -raw project_uuid)
          terraform state rm coolify_project.main
          terraform import coolify_project.main "$UUID"

      - name: Terraform Plan after import — expect no changes
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
          TF_VAR_server_uuid: ${{ steps.token.outputs.server_uuid }}
          TF_VAR_test_private_key: ${{ steps.prereqs.outputs.test_private_key }}
        run: |
          terraform plan -detailed-exitcode -no-color
          echo "No-op plan confirmed"

      - name: Terraform Destroy
        if: always()
        working-directory: tests/acceptance
        env:
          TF_VAR_coolify_endpoint: http://localhost:8000
          TF_VAR_coolify_token: ${{ steps.token.outputs.token }}
          TF_VAR_server_uuid: ${{ steps.token.outputs.server_uuid }}
          TF_VAR_test_private_key: ${{ steps.prereqs.outputs.test_private_key }}
        run: terraform destroy -auto-approve -no-color 2>&1 || true

      - name: Verify cleanup — 0 projects remaining
        if: always()
        run: |
          TOKEN="${{ steps.token.outputs.token }}"
          COUNT=$(curl -sf http://localhost:8000/api/v1/projects \
            -H "Authorization: Bearer $TOKEN" \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
          echo "Projects after destroy: $COUNT"
          echo "Cleanup check done"

      - name: Stop Coolify
        if: always()
        run: |
          sudo docker compose -f /data/coolify/source/docker-compose.yml \
            -f /data/coolify/source/docker-compose.prod.yml down -v 2>/dev/null || true
